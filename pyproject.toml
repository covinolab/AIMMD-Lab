[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimmd-lab"
version = "0.1.0"
description = "AI-guided path sampling for data generation and analysis of molecular systems characterized by rare-event transitions."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gianmarco Lazzeri" },
    { name = "Simon Lichtinger" },
]
keywords = [
    "molecular-dynamics",
    "ai",
    "enhanced-sampling",
    "path-sampling",
    "committor",
    "gromacs",
    "biophysics",
    "rare-event-transitions",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tqdm",
    "numpy",
    "scipy",
    "mdtraj",
    "psutil",
    "torch",
    "filelock",
    "matplotlib",
    "MDAnalysis",
]

[project.optional-dependencies]
# Graph descriptors (node tables, graph networks) and the PyG edge backend of
# the C-GAIMMD PaiNN network. torch-cluster has no wheels on PyPI: install the
# wheel built for your torch from https://data.pyg.org/whl/ first (see the
# installation docs). torch-geometric stays below 2.8: from 2.8 on, its
# radius_graph needs pyg-lib (not on PyPI) instead of torch-cluster.
graphs = [
    "torch-geometric<2.8",
    "torch-cluster",
    "lz4",
]
# C-GAIMMD (committor-conditioned Generative AIMMD) with the PaiNN
# flow-matching generator and the GROMACS candidate preparation.
cgaimmd = [
    "networkx",
]
# C-GAIMMD with the BioEmu2 generator, on the CPU or any GPU. bioemu2 needs
# Python 3.12 or later and torch >= 2.11, < 2.14; install torch first from the
# PyTorch index that matches your CUDA, and use the constraints file
# devtools/constraints-bioemu2.txt for the versions the tests ran with.
bioemu2 = [
    "aimmd-lab[cgaimmd]",
    "bioemu2==0.1.0rc0; python_version >= '3.12'",
]
# The same with the cuEquivariance kernels of the production BioEmu2 model
# (Linux, CUDA 13).
bioemu2-cuda = [
    "aimmd-lab[bioemu2]",
    "bioemu2[cuda]==0.1.0rc0; python_version >= '3.12' and sys_platform == 'linux'",
]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "networkx",
]
docs = [
    "sphinx",
    "furo",
    "myst-nb",
    "sphinx-copybutton",
    "sphinx-design",
]

[project.urls]
Homepage = "https://github.com/covinolab/AIMMD-Lab"
Documentation = "https://aimmd-lab.readthedocs.io"
Repository = "https://github.com/covinolab/AIMMD-Lab"
Issues = "https://github.com/covinolab/AIMMD-Lab/issues"

[tool.setuptools.packages.find]
include = ["aimmd*"]
exclude = ["tests*", "docs*", "examples*", "devtools*", "dev*", "implementation_trials*"]

[tool.setuptools.package-data]
aimmd = ["engines/*.mdp"]

[tool.pytest.ini_options]
# The markers (slow, graph, gromacs, bioemu2, bioemu2_weights, gpu) are
# registered in tests/conftest.py, next to the flags and checks that select them.
# Per-test time limit in seconds (pytest-timeout): a hung test fails instead
# of holding the CI job until GitHub's 6 h limit. The slowest test of the
# default lane takes about 3 min.
timeout = 900
