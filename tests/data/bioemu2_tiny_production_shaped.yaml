# A tiny, production-shaped BioEmu2 score model for the C-GAIMMD tests (CPU, random weights, no download).
#
# The config of the released checkpoint bioemu2-preview (microsoft/bioemu2 on Hugging Face, snapshot
# dd4b0c1b69984b68edcb6200a544213be4d75242, checkpoints/bioemu2-preview/config.yaml) with every production flag
# kept and every width and depth shrunk (token_s 16, token_z 8, a_s 32, atom_s 16, atom_z 4, one block each,
# trimul_variant full instead of the CUDA-only cuEquivariance kernel; s_input_dim = token_s + 71): 161,422
# parameters. Written by the probe preserved in the C-GAIMMD design folder (preserved_probes/probe_shrunk.py,
# 5 Nov 2026). The tests write it as config.yaml next to a seeded random model.ckpt and load it with
# bioemu2.load_model(checkpoint_path=...), as bioemu2's own tests/test_sampling.py does.
#
# Derived from bioemu2 (https://github.com/microsoft/bioemu2, commit e0b9903 = PyPI 0.1.0rc0):
