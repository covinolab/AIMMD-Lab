score_model:
  sequence_embedder:
    _target_: bioemu2.shortcuts.PairMixerSequenceEmbedder
    token_s: 16
    token_z: 8
    s_input_dim: 87
    msa_s: 8
    msa_blocks: 1
    msa_dropout: 0.15
    z_dropout: 0.0
    num_blocks: 1
    dropout: 0.0
    trimul_variant: full
    relpos_cfg: {}
    use_contact_conditioning: true
    use_method_conditioning: true
    embed_method_into_pairs: true
    use_paired_feature: true
    use_unconditional_branch: true
    opm_variant: vanilla
    tiling_cfg:
      tile_size: null
      chunk_size: null
      opm_tile_size: null
      transition_chunk_size: null
      trimul_tile_size: null
      pwa_chunk_heads: false
    precision_cfg:
      msa_module:
        opm_matmul_precision: null
        trimul_matmul_precision: null
      pairmixer_module:
        trimul_matmul_precision: null
  _target_: bioemu2.shortcuts.BioMoaCModel
  atom_s: 16
  atom_z: 4
  token_s: 16
  token_z: 8
  num_token_types: 33
  num_msa_tokens: 33
  num_pocket_classes: 4
  s_input_dim: 87
  a_s: 32
  a_z: null
  atoms_per_window_queries: 32
  atoms_per_window_keys: 128
  atom_attention_heads: 2
  max_atoms: null
  compile_score: false
  dim_fourier: 8
  diffusion_transformer_depth: 1
  token_attention_heads: 2
  conditioning_transition_layers: 1
  tiling_cfg:
    tile_size: null
    chunk_size: null
    attn_pair_bias_tile_size: null
    transition_chunk_size: null
  relpos_cfg: {}
  use_lns: false
  num_bins_distogram: 8
  edm_schedule:
    _target_: bioemu2.shortcuts.EDMSchedule
    sigma_min: 0.0004
    sigma_max: 160.0
    sigma_data: 16.0
  use_dynamics_conditioning: true
  downscale_condition_contrib: true
