name: pytest

on: [push, pull_request]

defaults:
  run:
    # conda setup requires this special shell
    shell: bash -l {0}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v3
    - uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: 3.13
        environment-file: devtools/conda-envs/test_env.yaml
        channels: conda-forge,defaults
        activate-environment: test
        auto-update-conda: true
        auto-activate-base: false
        show-channel-urls: true
    - name: Install build tools
      run: pip install --upgrade pip setuptools
    - name: Install AIMMD
      run: |
        pip install -e .
    - name: Check imports
      # outside pytest's output capture, so an import that kills the
      # interpreter (e.g. a broken BLAS) leaves its message in the log
      run: |
        python -c "import numpy, scipy, torch, MDAnalysis, mdtraj, aimmd; print('imports ok')"
    - name: Test with pytest
      run: |
        pytest -v --cov=aimmd --cov-report=xml --color=yes tests/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-AIMMD
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
