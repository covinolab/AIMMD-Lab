name: pytest

on: [push, pull_request]

# A newer push to the same branch or pull request cancels the run still going
# for the older commit; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # conda setup requires this special shell
    shell: bash -l {0}

# The core job: AIMMD-Lab as a plain `pip install -e .` user has it (no PyG,
# no bioemu2), with the default test lane. The tests of the optional parts
# (graphs, BioEmu2, GROMACS runs) skip themselves here and run in the jobs of
# cgaimmd.yml and nightly.yml; the import-isolation tests check that the
# optional stacks stay optional.
jobs:
  core:
    runs-on: ubuntu-latest
    # GitHub's default limit is 360 min, and two runs have hung that long.
    # The default lane takes about 16 min on 4 local cores; every test also
    # has a 900 s limit (pytest-timeout, pyproject.toml).
    timeout-minutes: 60
    strategy:
      max-parallel: 5
    env:
      # CPU-only runner: no CUDA probing, and a fixed thread count so that
      # float32 reductions do not depend on the runner's core count
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: 2

    steps:
    - uses: actions/checkout@v4
    - uses: conda-incubator/setup-miniconda@v3
      with:
        # Miniforge and conda-forge only: Miniconda's "defaults" channel asks
        # for its terms of service, which a CI job cannot accept
        miniforge-version: latest
        python-version: 3.13
        environment-file: devtools/conda-envs/test_env.yaml
        channels: conda-forge
        conda-remove-defaults: true
        activate-environment: test
        auto-update-conda: false
        auto-activate-base: false
        show-channel-urls: true
    - name: Install build tools
      run: pip install --upgrade pip setuptools
    - name: Install AIMMD
      run: |
        pip install -e .
    - name: Check imports
      # outside pytest's output capture, so an import that kills the
      # interpreter (e.g. a broken BLAS) leaves its message in the log
      run: |
        python -c "import numpy, scipy, torch, MDAnalysis, mdtraj, aimmd; print('imports ok')"
    - name: Test with pytest
      run: |
        pytest -v --cov=aimmd --cov-report=xml --color=yes tests/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-AIMMD
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
